<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tile Depot - Login</title>
    <link rel="icon" type="image/png" href="images/inventory_icon.png">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Poppins Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/password-toggle.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f6f7;
            font-family: 'Poppins', sans-serif;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            position: absolute;
            top: 30px;
            left: 37px;
            width: 170px;
            height: auto;
        }

        /* =========================
           CONTAINER
        ========================= */

        .auth-container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           SAME CARD SIZE
        ========================= */

        .auth-card {
            width: 412px;
            min-height: 474px;
            height: auto;

            background: #ffffff;

            border: 1px solid #d1d1d1;
            border-radius: 5px;

            padding: 27px 11px;

            text-align: center;
        }

        /* =========================
           TITLE
        ========================= */

        .login-title {
            margin: 0;

            color: #000000;

            font-size: 36px;
            font-weight: 700;

            line-height: 1.2;
        }

        .login-subtitle {
            margin-top: 2px;
            margin-bottom: 27px;

            color: #0808a8;

            font-size: 19px;
            font-weight: 400;
        }

        /* =========================
           FLOATING INPUT
        ========================= */

        .floating-input {
            position: relative;

            width: 100%;
            height: 56px;

            margin-bottom: 7px;
        }

        .floating-input input {
            width: 100%;
            height: 100%;

            padding: 20px 35px 5px 35px;

            border: 1px solid transparent;
            border-radius: 0;

            background: #f7f7f7;

            outline: none;

            color: #333333;

            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 500;

            transition: 0.2s ease;
        }

        .floating-input label {
            position: absolute;

            left: 35px;
            top: 50%;

            transform: translateY(-50%);

            color: #666666;

            font-size: 15px;
            font-weight: 600;

            pointer-events: none;

            transition: all 0.2s ease;
        }

        /* Floating label */
        .floating-input input:focus {
            background: #ffffff;
            border: 1px solid #777777;
        }

        .floating-input input:focus + label,
        .floating-input input:not(:placeholder-shown) + label {
            top: 8px;

            transform: translateY(0);

            font-size: 11px;
            font-weight: 600;
        }

        /* =========================
           ARROW
        ========================= */

        .arrow-btn {
            width: 78px;
            height: 68px;

            margin-top: 40px;

            border: 1px solid #d1d1d1;
            border-radius: 17px;

            background: #ffffff;

            color: #aaaaaa;

            font-family: 'Poppins', sans-serif;
            font-size: 34px;
            font-weight: 400;

            cursor: pointer;
        }

        .arrow-btn:hover {
            background: #fafafa;
        }

        .login-status {
            min-height: 24px;
            margin-top: 14px;
            font-size: 13px;
            font-weight: 500;
        }

        .login-status.loading {
            color: #666666;
        }

        .login-status.success {
            color: #16803c;
        }

        .login-status.error {
            color: #c62828;
        }

        /* =========================
           FORGOT PASSWORD
        ========================= */

        .forgot {
            display: block;

            margin-top: 30px;

            color: #858585;

            font-size: 18px;
            font-weight: 700;

            text-decoration: none;
        }

        .forgot:hover {
            color: #666666;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .logo {
                top: 20px;
                left: 20px;
                width: 110px;
            }

            .auth-card {
                width: calc(100% - 30px);
                max-width: 412px;
                min-height: 474px;
                height: auto;
            }

            .login-title {
                font-size: 32px;
            }

            .login-subtitle {
                font-size: 17px;
            }

        }

    </style>
</head>

<body>

    <!-- Logo -->
    <img
        src="images/tile-depot-logo.jpg"
        class="logo"
        alt="Tile Depot"
    >

    <!-- Login -->
    <main class="auth-container">

        <div class="auth-card">

            <h1 class="login-title">
                Welcome
            </h1>

            <div class="login-subtitle">
                Login to your account
            </div>

            <form id="loginForm" method="post" action="javascript:void(0)" novalidate autocomplete="off">

                <!-- Email -->
                <div class="floating-input">

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder=" "
                        required
                    >

                    <label for="email">
                        EMAIL ADDRESS
                    </label>

                </div>

                <!-- Password -->
                <div class="floating-input">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder=" "
                        required
                    >

                    <label for="password">
                        PASSWORD
                    </label>

                </div>

                <!-- Login -->
                <button
                    type="submit"
                    class="arrow-btn"
                >
                    →
                </button>

            </form>

            <div
                id="loginStatus"
                class="login-status"
                role="status"
                aria-live="polite"
            ></div>

            <!-- Forgot Password -->
            <a
                href="forgot-password.html"
                class="forgot"
            >
                FORGOT PASSWORD?
            </a>

        </div>

    </main>


    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/script.js"></script>
    <script src="js/password-toggle.js" defer></script>

</body>
</html>
