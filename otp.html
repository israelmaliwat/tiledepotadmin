<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tile Depot - Authenticator</title>
    <link rel="icon" type="image/png" href="images/inventory_icon.png">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Poppins Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #f5f6f7;

            font-family: 'Poppins', sans-serif;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            position: absolute;

            top: 30px;
            left: 37px;
            width: 170px;
            height: auto;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .auth-container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           AUTH CARD
           SAME SIZE AS
           INDEX + FORGOT PASSWORD
        ========================= */

        .auth-card {
            width: 412px;
            min-height: 474px;
            height: auto;

            background: #ffffff;

            border: 1px solid #d1d1d1;
            border-radius: 5px;

            padding: 27px 11px;

            text-align: center;

            position: relative;

            overflow: visible;
        }


        /* =========================
           TITLE
        ========================= */

        .otp-title {
            margin: 0;

            color: #000000;

            font-size: 36px;
            font-weight: 700;

            line-height: 1.2;
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .otp-description {
            margin-top: 7px;

            color: #0808a8;

            font-size: 19px;
            font-weight: 400;

            line-height: 1.45;
        }

        .email {
            font-style: italic;
        }

        .enroll-panel {
            margin-top: 18px;
        }

        .enroll-panel.is-hidden {
            display: none;
        }

        .totp-qr {
            width: 180px;
            height: 180px;
            background: #f7f7f7;
            border: 1px solid #d1d1d1;
        }

        .totp-secret-label {
            margin-top: 10px;
            color: #666666;
            font-size: 12px;
            font-weight: 500;
        }

        .totp-secret {
            margin-top: 4px;
            color: #111111;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            word-break: break-all;
        }

        .authenticator-hint {
            margin: 12px 18px 0;
            color: #858585;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
        }

        .remember-browser {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            color: #555555;
            font-size: 13px;
            cursor: pointer;
        }

        .remember-browser[hidden] {
            display: none;
        }

        .remember-browser input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: #0808a8;
        }


        /* =========================
           OTP INPUTS
        ========================= */

        .otp-inputs {
            display: flex;

            justify-content: center;

            gap: 9px;

            margin-top: 27px;
        }


        .otp-input {
            width: 52px;
            height: 80px;

            padding: 0;

            border: none;

            background: #e3e3e3;

            color: #333333;

            text-align: center;

            font-family: 'Poppins', sans-serif;

            font-size: 28px;
            font-weight: 600;

            outline: none;
        }


        .otp-input:focus {
            background: #d8d8d8;

            box-shadow: 0 0 0 2px #aaaaaa;
        }


        /* =========================
           MESSAGE SPACE

           IMPORTANT:
           The space always exists,
           so showing the message
           doesn't move the button
           or links.
        ========================= */

        .message-container {
            display: flex;
            visibility: hidden;
            width: 100%;
            min-height: 42px;
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 500;
            opacity: 0;
            background: transparent;
            border: 1px solid transparent;
            box-shadow: none;
        }

        .message-container.show {
            visibility: visible;
            opacity: 1;
        }

        .message-container.show.success {
            background: #dfeee8;
            color: #2f5d4d;
            border: 1px solid #accfbb;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .message-container.show.error {
            background: #fbe7e7;
            color: #7f2d2d;
            border: 1px solid #edb9b9;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .toast-content {
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.2;
        }

        .toast-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.08);
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .toast-close {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            padding: 0 0 0 12px;
            opacity: 0.7;
        }

        .toast-close:hover {
            opacity: 1;
        }


        /* =========================
           ARROW BUTTON
        ========================= */

        .arrow-btn {
            width: 78px;
            height: 68px;

            margin-top: 20px;

            border: 1px solid #d1d1d1;
            border-radius: 17px;

            background: #ffffff;

            color: #aaaaaa;

            font-family: 'Poppins', sans-serif;

            font-size: 34px;
            font-weight: 400;

            cursor: pointer;
        }


        .arrow-btn:hover {
            background: #fafafa;
        }


        /* =========================
           RESEND CODE
        ========================= */

        .resend {
            display: block;

            margin-top: 12px;

            color: #858585;

            font-size: 18px;
            font-weight: 700;

            line-height: 1.3;

            text-decoration: none;

            cursor: pointer;
        }


        .resend:hover {
            color: #666666;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .logo {
                top: 20px;
                left: 20px;

                width: 110px;
            }


            .auth-card {
                width: calc(100% - 30px);

                max-width: 412px;

                min-height: 474px;
                height: auto;
            }


            .otp-title {
                font-size: 30px;
            }


            .otp-description {
                font-size: 17px;
            }


            .otp-inputs {
                gap: 5px;
            }


            .otp-input {
                width: 44px;
                height: 70px;
            }


            .resend {
                font-size: 17px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         TILE DEPOT LOGO
    ========================= -->

    <img
        src="images/tile-depot-logo.jpg"
        class="logo"
        alt="Tile Depot"
    >


    <!-- =========================
         OTP PAGE
    ========================= -->

    <main class="auth-container">

        <div class="auth-card">


            <!-- =========================
                 TITLE
            ========================= -->

            <h1 class="otp-title">
                Authenticator Code
            </h1>


            <!-- =========================
                 DESCRIPTION
            ========================= -->

            <div class="otp-description">

                Enter the six-digit code from Google Authenticator

                <span class="email"></span>

                below.

            </div>

            <div id="enrollPanel" class="enroll-panel is-hidden">
                <img id="totpQr" class="totp-qr" alt="Google Authenticator QR code">
                <div class="totp-secret-label">Can't scan? Enter this key</div>
                <div id="totpSecret" class="totp-secret"></div>
            </div>


            <!-- =========================
                 OTP BOXES
            ========================= -->

            <div class="otp-inputs">

                <input class="otp-input" maxlength="1" type="text" inputmode="numeric" autocomplete="one-time-code">
                <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
                <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
                <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
                <input class="otp-input" maxlength="1" type="text" inputmode="numeric">
                <input class="otp-input" maxlength="1" type="text" inputmode="numeric">

            </div>

            <label class="remember-browser" id="rememberBrowserOption" hidden>
                <input type="checkbox" id="rememberBrowser">
                <span>Remember this browser for 30 days</span>
            </label>

            <div class="message-container" id="verificationStatus" role="status" aria-live="polite"></div>


            <!-- =========================
                 SUCCESS MESSAGE
            ========================= -->

            <!-- =========================
                 CONTINUE BUTTON
            ========================= -->

            <button
                type="button"
                class="arrow-btn"
                id="verifyBtn"
            >
                →
            </button>


            <p class="authenticator-hint">
                Use Google Authenticator. The code refreshes about every 30 seconds.
            </p>

            <a
                href="index.html"
                class="resend"
                id="backToLogin"
            >
                BACK TO LOGIN
            </a>


        </div>

    </main>


    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/otp.js"></script>

</body>
</html>
