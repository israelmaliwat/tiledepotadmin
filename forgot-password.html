<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tile Depot - Reset Password</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #f5f6f7;

            font-family: 'Poppins', sans-serif;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            position: absolute;

            top: 30px;
            left: 37px;
            width: 170px;
            height: auto;
        }


        /* =========================
           CONTAINER
        ========================= */

        .auth-container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           CARD
           SAME SIZE AS LOGIN + OTP
        ========================= */

        .auth-card {
            width: 412px;
            height: 474px;

            background: #ffffff;

            border: 1px solid #d1d1d1;
            border-radius: 5px;

            padding: 27px 11px;

            text-align: center;

            position: relative;

            overflow: hidden;
        }


        /* =========================
           TITLE
        ========================= */

        .reset-title {
            margin: 0;

            color: #000000;

            font-size: 36px;
            font-weight: 700;

            line-height: 1.2;
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .reset-description {
            margin-top: 10px;

            color: #0808a8;

            font-size: 19px;
            font-weight: 400;

            line-height: 1.45;
        }

        .email {
            font-style: italic;
        }


        /* =========================
           OTP INPUTS
        ========================= */

        .otp-inputs {
            display: flex;

            justify-content: center;

            gap: 9px;

            margin-top: 27px;
        }

        .otp-input {
            width: 52px;
            height: 80px;

            padding: 0;

            border: none;

            background: #e3e3e3;

            color: #333333;

            text-align: center;

            font-family: 'Poppins', sans-serif;

            font-size: 28px;
            font-weight: 600;

            outline: none;
        }

        .otp-input:focus {
            background: #d8d8d8;

            box-shadow: 0 0 0 2px #aaaaaa;
        }


        /* =========================
           SUCCESS MESSAGE
        ========================= */

        .message-container {
            width: 100%;
            height: 27px;

            margin-top: 14px;
        }

        .success-message {
            display: none;

            width: 100%;
            height: 27px;

            padding: 3px 15px;

            background: #d5ebe5;

            color: #667b77;

            text-align: left;

            font-size: 11px;
            font-weight: 400;

            align-items: center;
        }

        .success-message.show {
            display: flex;
        }

        .success-icon {
            margin-right: 18px;

            color: #55746e;

            font-size: 17px;
        }


        /* =========================
           ARROW BUTTON
        ========================= */

        .arrow-btn {
            width: 78px;
            height: 68px;

            margin-top: 20px;

            border: 1px solid #d1d1d1;
            border-radius: 17px;

            background: #ffffff;

            color: #aaaaaa;

            font-family: 'Poppins', sans-serif;

            font-size: 34px;
            font-weight: 400;

            cursor: pointer;
        }

        .arrow-btn:hover {
            background: #fafafa;
        }


        /* =========================
           LINKS
        ========================= */

        .resend,
        .back-login {
            display: block;

            color: #858585;

            font-size: 18px;
            font-weight: 700;

            line-height: 1.3;

            text-decoration: none;

            cursor: pointer;
        }

        .resend {
            margin-top: 12px;
        }

        .back-login {
            margin-top: 0;
        }

        .resend:hover,
        .back-login:hover {
            color: #666666;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .logo {
                top: 20px;
                left: 20px;

                width: 110px;
            }

            .auth-card {
                width: calc(100% - 30px);

                max-width: 412px;

                height: 474px;
            }

            .reset-title {
                font-size: 30px;
            }

            .reset-description {
                font-size: 17px;
            }

            .otp-inputs {
                gap: 5px;
            }

            .otp-input {
                width: 44px;
                height: 70px;
            }

            .resend,
            .back-login {
                font-size: 17px;
            }

        }

    </style>
</head>

<body>


    <!-- =========================
         TILE DEPOT LOGO
    ========================= -->

    <img
        src="images/tile-depot-logo.jpg"
        class="logo"
        alt="Tile Depot"
    >


    <!-- =========================
         RESET PASSWORD
    ========================= -->

    <main class="auth-container">

        <div class="auth-card">


            <!-- TITLE -->

            <h1 class="reset-title">
                Reset Password
            </h1>


            <!-- DESCRIPTION -->

            <div class="reset-description">

                Enter the six-digit code sent to your<br>

                email address

                <span class="email">
                    (ro****@gmail.com)
                </span>

                <br>

                below to reset password

            </div>


            <!-- =========================
                 OTP INPUTS
            ========================= -->

            <div class="otp-inputs">

                <input
                    class="otp-input"
                    maxlength="1"
                    type="text"
                    inputmode="numeric"
                >

                <input
                    class="otp-input"
                    maxlength="1"
                    type="text"
                    inputmode="numeric"
                >

                <input
                    class="otp-input"
                    maxlength="1"
                    type="text"
                    inputmode="numeric"
                >

                <input
                    class="otp-input"
                    maxlength="1"
                    type="text"
                    inputmode="numeric"
                >

                <input
                    class="otp-input"
                    maxlength="1"
                    type="text"
                    inputmode="numeric"
                >

                <input
                    class="otp-input"
                    maxlength="1"
                    type="text"
                    inputmode="numeric"
                >

            </div>


            <!-- =========================
                 MESSAGE AREA

                 This always reserves
                 27px of space so the
                 links don't move.
            ========================= -->

            <div class="message-container">

                <div
                    id="successMessage"
                    class="success-message"
                >

                    <span class="success-icon">
                        ✓
                    </span>

                    <span>
                        Email has been re-sent.
                    </span>

                </div>

            </div>


            <!-- =========================
                 CONTINUE BUTTON
            ========================= -->

            <button
                type="button"
                class="arrow-btn"
                id="continueBtn"
            >
                →
            </button>


            <!-- =========================
                 RESEND
            ========================= -->

            <a
                href="#"
                class="resend"
                id="resendBtn"
            >
                RESEND CODE
            </a>


            <!-- =========================
                 BACK TO LOGIN
            ========================= -->

            <a
                href="index.html"
                class="back-login"
            >
                GO BACK TO LOGIN
            </a>


        </div>

    </main>


    <script>

        /* =========================
           OTP INPUT BEHAVIOR
        ========================= */

        const inputs =
            document.querySelectorAll(".otp-input");


        inputs.forEach((input, index) => {


            /* Only allow numbers */

            input.addEventListener("input", () => {

                input.value =
                    input.value.replace(/[^0-9]/g, "");


                /* Move to next box */

                if (
                    input.value.length === 1 &&
                    index < inputs.length - 1
                ) {

                    inputs[index + 1].focus();

                }

            });


            /* Backspace */

            input.addEventListener("keydown", (event) => {

                if (
                    event.key === "Backspace" &&
                    input.value === "" &&
                    index > 0
                ) {

                    inputs[index - 1].focus();

                }

            });

        });


        /* =========================
           RESEND CODE
        ========================= */

        const resendBtn =
            document.getElementById("resendBtn");

        const successMessage =
            document.getElementById("successMessage");


        resendBtn.addEventListener("click", (event) => {

            event.preventDefault();


            /* Show message */

            successMessage.classList.add("show");


            /* Hide after 5 seconds */

            setTimeout(() => {

                successMessage.classList.remove("show");

            }, 5000);

        });


        /* =========================
           CONTINUE BUTTON
        ========================= */

        const continueBtn =
            document.getElementById("continueBtn");


        continueBtn.addEventListener("click", () => {

            let otp = "";


            inputs.forEach(input => {

                otp += input.value;

            });


            if (otp.length !== 6) {

                alert("Please enter the six-digit OTP.");

                return;

            }


            /* Go to new password page */

            window.location.href =
                "new-password.html";

        });

    </script>

</body>
</html>
